name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  agent-trust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Agent-trust and lightweight tests
        run: |
          go test ./agenttrust/ -count=1
          go test ./imecore/ -count=1
